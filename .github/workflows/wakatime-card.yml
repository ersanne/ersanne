name: WakaTime Card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily, off the top of the hour to avoid scheduler congestion

permissions:
  contents: write

concurrency:
  group: wakatime-card
  cancel-in-progress: true

jobs:
  update-card:
    name: Render WakaTime card
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the public WakaTime profile, so "Display code time publicly" and
      # "Display languages, editors, os, categories publicly" must stay enabled.
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: wakatime
          options: username=547fc8ef-de13-46b4-94a5-2ad55266453d&layout=compact&langs_count=6&hide=Other,Text&hide_title=true&hide_border=true&bg_color=1a1b27&text_color=c0caf5&title_color=FF4D8D&icon_color=FF4D8D
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keeps the last good card instead of committing an error card.
          fail_on_error: true

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/wakatime.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(readme): update WakaTime card"
          git push
